<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodízio e Movimentação de Pneus - Dark Theme</title>
    <link href="styles.css">
</head>
<body>

<div class="container">
    <div class="card">
        <div class="card-header">
            <h2>Rodízio & Movimentação de Pneus</h2>
        </div>

        <form action="/salvar-movimentacao" method="POST" data-api-endpoint="/viagens">
            
            <!-- 01. ORIGEM -->
            <div class="section-title" style="margin-top:0;">01. Origem (Atual Posição)</div>
            
            <div class="grid-2">
                <div class="form-group">
                    <label for="veiculo_origem">Veículo de Origem*</label>
                    <select id="veiculo_origem" name="veiculo_origem" required onchange="carregarPneusOrigem()">
                        <option value="">Selecione o veículo...</option>
                        <option value="1">ABC1D23 - Cargo 816</option>
                        <option value="2">XYZ9876 - FH 540</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="posicao_origem">Posição / Rodado Atual*</label>
                    <select id="posicao_origem" name="posicao_origem" required onchange="atualizarInfoPneu()">
                        <option value="">Selecione a posição...</option>
                        <option value="E0E" data-fogo="PN-0042" data-marca="Michelin 295/80" data-sulco="12mm">E0E - Dianteiro Esquerdo</option>
                        <option value="E0D" data-fogo="PN-0089" data-marca="Goodyear 295/80" data-sulco="10mm">E0D - Dianteiro Direito</option>
                        <option value="E1EE" data-fogo="PN-0102" data-marca="Bridgestone 295/80" data-sulco="8mm">E1EE - Traseiro Ext. Esquerdo</option>
                    </select>
                </div>
            </div>

            <!-- Card Informativo do Pneu Selecionado -->
            <div class="pneu-info-card" id="cardPneuInfo">
                <div class="pneu-info-item">
                    <span class="label">Nº Fogo</span>
                    <span class="value" id="infoFogo">PN-0042</span>
                </div>
                <div class="pneu-info-item">
                    <span class="label">Marca / Medida</span>
                    <span class="value" id="infoMarca">Michelin 295/80</span>
                </div>
                <div class="pneu-info-item">
                    <span class="label">Sulco Atual</span>
                    <span class="value" id="infoSulco" style="color: var(--primary-blue);">12.0 mm</span>
                </div>
            </div>

            <!-- 02. DESTINO -->
            <div class="section-title">02. Destino da Movimentação</div>

            <div class="form-group">
                <label for="tipo_movimentacao">Tipo de Operação*</label>
                <select id="tipo_movimentacao" name="tipo_movimentacao" required onchange="alternarCamposDestino()">
                    <option value="rodizio_mesmo">Rodízio no mesmo veículo</option>
                    <option value="troca_veiculo">Transferir para outro veículo</option>
                    <option value="estepe">Mover para Estepe</option>
                    <option value="estoque">Desmontar para Estoque</option>
                    <option value="recapagem">Enviar para Recapagem / Manutenção</option>
                </select>
            </div>

            <div class="grid-2" id="boxDestinoVeiculo">
                <div class="form-group">
                    <label for="veiculo_destino">Veículo de Destino*</label>
                    <select id="veiculo_destino" name="veiculo_destino">
                        <option value="mesmo">Mesmo Veículo (ABC1D23)</option>
                        <option value="2">XYZ9876 - FH 540</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="posicao_destino">Nova Posição / Rodado*</label>
                    <select id="posicao_destino" name="posicao_destino">
                        <option value="">Selecione o destino...</option>
                        <option value="E0D">E0D - Dianteiro Direito</option>
                        <option value="E1ED">E1ED - Traseiro Ext. Direito</option>
                        <option value="ESTEPE">EST1 - Estepe</option>
                    </select>
                </div>
            </div>

            <!-- 03. DADOS DA OPERAÇÃO -->
            <div class="section-title">03. Detalhes do Lançamento</div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="km_troca">KM do Veículo no Momento*</label>
                    <input type="number" id="km_troca" name="km_troca" placeholder="Ex: 45200" required>
                </div>
                <div class="form-group">
                    <label for="motivo">Motivo da Movimentação*</label>
                    <select id="motivo" name="motivo" required>
                        <option value="preventivo">Rodízio Preventivo / Desgaste Regular</option>
                        <option value="desgaste_irregular">Correção de Desgaste Irregular</option>
                        <option value="furo_avaria">Furo / Avaria na Banda</option>
                        <option value="fim_vida">Fim de Vida Útil / Reforma</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="observacoes">Observações do Borracheiro / Técnico</label>
                <textarea id="observacoes" name="observacoes" rows="2" placeholder="Ex: Efetuado também o alinhamento do eixo dianteiro após a troca..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Confirmar Movimentação</button>
        </form>
    </div>
</div>

<script>
    function atualizarInfoPneu() {
        const select = document.getElementById('posicao_origem');
        const option = select.options[select.selectedIndex];
        
        if (option.value) {
            document.getElementById('infoFogo').innerText = option.getAttribute('data-fogo');
            document.getElementById('infoMarca').innerText = option.getAttribute('data-marca');
            document.getElementById('infoSulco').innerText = option.getAttribute('data-sulco');
        }
    }

    function alternarCamposDestino() {
        const tipo = document.getElementById('tipo_movimentacao').value;
        const boxDestino = document.getElementById('boxDestinoVeiculo');

        if (tipo === 'estoque' || tipo === 'recapagem') {
            boxDestino.style.display = 'none';
        } else {
            boxDestino.style.display = 'grid';
        }
    }
</script>

<script type="module" src="/js/api.js"></script>
</body>
</html>

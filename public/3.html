<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pneu - Dark Theme</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: #161f30;
            --card-border: #233148;
            --input-bg: #0f172a;
            --input-border: #2a3a53;
            --primary-blue: #38bdf8;
            --primary-blue-hover: #7dd3fc;
            --text-title: #f8fafc;
            --text-main: #94a3b8;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 650px;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 24px;
            border: 1px solid var(--card-border);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
        }

        h2 { 
            font-size: 16px; 
            font-weight: 700; 
            color: var(--text-title); 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
        }

        .section-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary-blue);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: var(--card-border);
        }

        .form-group { margin-bottom: 16px; }
        
        label { 
            display: block; 
            font-size: 11px; 
            font-weight: 600; 
            color: var(--text-muted); 
            margin-bottom: 6px; 
            text-transform: uppercase; 
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            font-size: 13px;
            background-color: var(--input-bg);
            color: var(--text-title);
            transition: border 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-blue);
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

        @media (max-width: 600px) {
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
        }

        .btn-submit {
            background-color: var(--primary-blue);
            color: #0f172a;
            border: none;
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover { 
            background-color: var(--primary-blue-hover); 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="card-header">
            <h2>Cadastro de Pneu</h2>
        </div>

        <form action="/salvar-pneu" method="POST">
            
            <!-- Identificação do Pneu -->
            <div class="section-title">01. Identificação</div>
            
            <div class="grid-2">
                <div class="form-group">
                    <label for="fogo">Nº de Fogo / Código*</label>
                    <input type="text" id="fogo" name="fogo" placeholder="Ex: PN-0042" required>
                </div>
                <div class="form-group">
                    <label for="serie">Nº de Série (Fábrica)</label>
                    <input type="text" id="serie" name="serie" placeholder="Ex: 849302911">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="marca">Marca*</label>
                    <input type="text" id="marca" name="marca" placeholder="Ex: Michelin, Goodyear" required>
                </div>
                <div class="form-group">
                    <label for="medida">Medida / Dimensão*</label>
                    <input type="text" id="medida" name="medida" placeholder="Ex: 295/80 R22.5" required>
                </div>
            </div>

            <!-- Condição e Vida Utíl -->
            <div class="section-title">02. Status e Ciclo de Vida</div>

            <div class="grid-3">
                <div class="form-group">
                    <label for="status_vida">Vida Atual*</label>
                    <select id="status_vida" name="status_vida" required>
                        <option value="novo">Novo (Original)</option>
                        <option value="r1">1ª Recapagem (R1)</option>
                        <option value="r2">2ª Recapagem (R2)</option>
                        <option value="r3">3ª Recapagem (R3)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="status_pneu">Situação*</label>
                    <select id="status_pneu" name="status_pneu" required>
                        <option value="estoque">Em Estoque</option>
                        <option value="aplicado">Aplicado em Veículo</option>
                        <option value="manutencao">Em Manutenção/Reforma</option>
                        <option value="descartado">Descartado/Sucata</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="dot">DOT / Fabricações</label>
                    <input type="text" id="dot" name="dot" placeholder="Ex: 1223" maxlength="4">
                </div>
            </div>

            <!-- Dados Técnicos Iniciais -->
            <div class="section-title">03. Medição Inicial (Calibração)</div>

            <div class="grid-3">
                <div class="form-group">
                    <label for="sulco_inicial">Sulco Atual (mm)*</label>
                    <input type="number" id="sulco_inicial" name="sulco_inicial" step="0.1" placeholder="18.0" required>
                </div>
                <div class="form-group">
                    <label for="pressao_inicial">Pressão Atual (PSI)*</label>
                    <input type="number" id="pressao_inicial" name="pressao_inicial" placeholder="105" required>
                </div>
                <div class="form-group">
                    <label for="valor_compra">Valor de Compra (R$)</label>
                    <input type="number" id="valor_compra" name="valor_compra" step="0.01" placeholder="0,00">
                </div>
            </div>

            <div class="form-group">
                <label for="observacoes">Observações Gerais</label>
                <textarea id="observacoes" name="observacoes" rows="3" placeholder="Informações adicionais sobre o pneu..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Salvar Pneu</button>
        </form>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Sistema - Dark Theme</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: #161f30;
            --card-border: #233148;
            --input-bg: #0f172a;
            --input-border: #2a3a53;
            --primary-blue: #38bdf8;
            --primary-blue-hover: #7dd3fc;
            --text-title: #f8fafc;
            --text-main: #94a3b8;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            max-width: 420px;
            width: 100%;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-header h1 {
            color: var(--text-title);
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 6px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 24px;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        /* NAVEGAÇÃO ENTRE TABS (LOGIN / CADASTRO) */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 0;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: var(--primary-blue);
            border-bottom-color: var(--primary-blue);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* ESTILOS DOS CAMPOS */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            font-size: 13px;
            background-color: var(--input-bg);
            color: var(--text-title);
            transition: border 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-blue);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            margin-bottom: 20px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .remember-me input {
            width: auto;
        }

        .forgot-password {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .btn-submit {
            background-color: var(--primary-blue);
            color: #0f172a;
            border: none;
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--primary-blue-hover);
        }
    </style>
</head>
<body>

<div class="auth-container">
    
    <div class="auth-header">
        <h1>Gestão de Frotas</h1>
        <p>Acesse o painel para gerenciar seus veículos e pneus</p>
    </div>

    <div class="card">
        <!-- NAUFRÁGIO / TABS DE NAVEGAÇÃO -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Entrar</button>
            <button class="tab-btn" onclick="switchTab('register')">Criar Conta</button>
        </div>

        <!-- FORMULÁRIO DE LOGIN -->
        <div id="tab-login" class="tab-content active">
            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="login_email">E-mail ou Usuário*</label>
                    <input type="text" id="login_email" name="email" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="login_password">Senha*</label>
                    <input type="password" id="login_password" name="password" placeholder="••••••••" required>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember"> Lembrar-me
                    </label>
                    <a href="#" class="forgot-password">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn-submit">Acessar Sistema</button>
            </form>
        </div>

        <!-- FORMULÁRIO DE CADASTRO -->
        <div id="tab-register" class="tab-content">
            <form action="/register" method="POST">
                <div class="form-group">
                    <label for="reg_nome">Nome Completo*</label>
                    <input type="text" id="reg_nome" name="nome" placeholder="Ex: João da Silva" required>
                </div>

                <div class="form-group">
                    <label for="reg_email">E-mail Profissional*</label>
                    <input type="email" id="reg_email" name="email" placeholder="seu@empresa.com" required>
                </div>

                <div class="form-group">
                    <label for="reg_perfil">Perfil de Acesso*</label>
                    <select id="reg_perfil" name="perfil" required>
                        <option value="">Selecione...</option>
                        <option value="gestor">Gestor / Administrador</option>
                        <option value="borracheiro">Inspetor / Borracheiro</option>
                        <option value="motorista">Motorista</option>
                    </select>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="reg_senha">Senha*</label>
                        <input type="password" id="reg_senha" name="senha" placeholder="••••••••" required>
                    </div>
                    <div class="form-group">
                        <label for="reg_confirma_senha">Confirmar Senha*</label>
                        <input type="password" id="reg_confirma_senha" name="confirma_senha" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit" style="margin-top: 10px;">Cadastrar Conta</button>
            </form>
        </div>

    </div>
</div>

<script>
    function switchTab(tabName) {
        // Remove active class from buttons and contents
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        // Add active class to selected tab
        if (tabName === 'login') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-login').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-register').classList.add('active');
        }
    }
</script>

</body>
</html>

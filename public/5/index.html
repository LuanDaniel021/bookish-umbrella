<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Unificado de Veículo e CRLV</title>
    <link rel="stylesheet" type="text/css" href="./styles.css">
</head>
<body>

<div class="container">
    <div class="card">
        <div class="card-header">
            <h2>Cadastro do Veículo & Documentação CRLV</h2>
        </div>

        <form action="/salvar-caminhao-crlv" method="POST" enctype="multipart/form-data" data-api-endpoint="/crlvs">
            
            <!-- 01. DADOS DO VEÍCULO -->
            <div class="section-title" style="margin-top:0;">01. Dados do Veículo</div>
            
            <div class="grid-2">
                <div class="form-group">
                    <label for="placa">Placa*</label>
                    <input type="text" id="placa" name="placa" placeholder="ABC1D23" maxlength="8" required>
                </div>
                <div class="form-group">
                    <label for="renavam">RENAVAM*</label>
                    <input type="text" id="renavam" name="renavam" maxlength="11" required>
                </div>
            </div>

            <div class="form-group">
                <label for="chassi">Número do Chassi*</label>
                <input type="text" id="chassi" name="chassi" placeholder="9BW ZZZ377 VT 000000" maxlength="17" required>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="marca">Marca*</label>
                    <input type="text" id="marca" name="marca" placeholder="Ex: Ford, Volvo, Scania" required>
                </div>
                <div class="form-group">
                    <label for="modelo">Modelo*</label>
                    <input type="text" id="modelo" name="modelo" placeholder="Ex: Cargo 816" required>
                </div>
            </div>

            <div class="grid-3">
                <div class="form-group">
                    <label for="ano_fab">Ano Fab.*</label>
                    <input type="number" id="ano_fab" name="ano_fab" placeholder="2022" min="1950" max="2030" required>
                </div>
                <div class="form-group">
                    <label for="ano_mod">Ano Mod.*</label>
                    <input type="number" id="ano_mod" name="ano_mod" placeholder="2023" min="1950" max="2030" required>
                </div>
                <div class="form-group">
                    <label for="km_inicial">KM Atual*</label>
                    <input type="number" id="km_inicial" name="km_inicial" placeholder="45200" required>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="carroceria">Carroceria*</label>
                    <select id="carroceria" name="carroceria" required>
                        <option value="">Selecione...</option>
                        <option value="trator">Cavalo Mecânico</option>
                        <option value="bau">Baú</option>
                        <option value="sider">Sider</option>
                        <option value="graneleiro">Graneleiro</option>
                        <option value="cacamba">Caçamba</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="combustivel">Combustível*</label>
                    <select id="combustivel" name="combustivel" required>
                        <option value="diesel">Diesel</option>
                        <option value="gnv">Gás Natural (GNV)</option>
                        <option value="eletrico">Elétrico</option>
                    </select>
                </div>
            </div>

            <!-- 02. DISPLAY DE EIXOS -->
            <div class="section-title">02. Display de Rodas (Template)</div>

            <div class="form-group">
                <label for="template_eixos_id">Template de Eixos*</label>
                <select id="template_eixos_id" name="template_eixos_id" required onchange="atualizarPreview()">
                    <option value="">Selecione o layout de rodas...</option>
                    <option value="1" data-preview="E0E - E0D -> eixo 0, direcional&#10;E1EE E1IE - E1ID E1ED -> eixo 1, tração">Cavalo 4x2 (2 Eixos)</option>
                    <option value="2" data-preview="E0E - E0D -> eixo 0, direcional&#10;E1EE E1IE - E1ID E1ED -> eixo 1, tração&#10;E2EE E2IE - E2ID E2ED -> eixo 2, livre">Cavalo 6x2 Trucado (3 Eixos)</option>
                    <option value="3" data-preview="E0EE E0IE - E0ID E0ED -> eixo 0, livre&#10;E1EE E1IE - E1ID E1ED -> eixo 1, livre&#10;E2EE E2IE - E2ID E2ED -> eixo 2, livre">Carreta 3 Eixos (Semirreboque)</option>
                </select>
            </div>

            <div class="template-preview-card" id="boxPreview">
                <div class="template-preview-title">Estrutura do Layout Selecionado</div>
                <div class="template-preview-code" id="textoPreview"></div>
            </div>

            <!-- 03. DADOS DO CRLV-e -->
            <div class="section-title">03. Documentação CRLV-e</div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="exercicio">Ano Exercício*</label>
                    <input type="number" id="exercicio" name="exercicio" placeholder="2026" min="2020" max="2035" required>
                </div>
                <div class="form-group">
                    <label for="numero_crlv">Número do CRLV-e*</label>
                    <input type="text" id="numero_crlv" name="numero_crlv" placeholder="01234567890" required>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="codigo_seguranca">Código Segurança CLA*</label>
                    <input type="text" id="codigo_seguranca" name="codigo_seguranca" placeholder="000000000" required>
                </div>
                <div class="form-group">
                    <label for="uf_veiculo">UF Licenciamento*</label>
                    <select id="uf_veiculo" name="uf_veiculo" required>
                        <option value="">Selecione...</option>
                        <option value="SP">São Paulo (SP)</option>
                        <option value="RJ">Rio de Janeiro (RJ)</option>
                        <option value="MG">Minas Gerais (MG)</option>
                        <option value="PR">Paraná (PR)</option>
                        <option value="SC">Santa Catarina (SC)</option>
                        <option value="RS">Rio Grande do Sul (RS)</option>
                    </select>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="nome_proprietario">Nome / Razão Social Proprietário*</label>
                    <input type="text" id="nome_proprietario" name="nome_proprietario" placeholder="Logística Brasil LTDA" required>
                </div>
                <div class="form-group">
                    <label for="documento_proprietario">CPF / CNPJ Proprietário*</label>
                    <input type="text" id="documento_proprietario" name="documento_proprietario" placeholder="00.000.000/0001-00" required>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="categoria">Categoria*</label>
                    <select id="categoria" name="categoria" required>
                        <option value="aluguel">Aluguel (Placa Vermelha / Mercosul)</option>
                        <option value="particular">Particular</option>
                        <option value="oficial">Oficial</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="rntrc">Nº RNTRC (ANTT)</label>
                    <input type="text" id="rntrc" name="rntrc" placeholder="123456789">
                </div>
            </div>

            <!-- 04. MIDIAS E ARQUIVOS -->
            <div class="section-title">04. Arquivos e Mídia</div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="arquivo_crlv">PDF do CRLV-e*</label>
                    <input type="file" id="arquivo_crlv" name="arquivo_crlv" accept=".pdf,image/*" required>
                </div>
                <div class="form-group">
                    <label for="foto_veiculo">Foto do Caminhão</label>
                    <input type="file" id="foto_veiculo" name="foto_veiculo" accept="image/*">
                </div>
            </div>

            <div class="form-group">
                <label for="observacoes">Observações Gerais</label>
                <textarea id="observacoes" name="observacoes" rows="2" placeholder="Histórico ou detalhes operacionais adicionais..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Salvar Veículo e CRLV</button>
        </form>
    </div>
</div>

<script>
    function atualizarPreview() {
        const select = document.getElementById('template_eixos_id');
        const option = select.options[select.selectedIndex];
        const previewBox = document.getElementById('boxPreview');
        const previewText = document.getElementById('textoPreview');

        const previewData = option.getAttribute('data-preview');

        if (previewData) {
            previewText.innerText = previewData;
            previewBox.style.display = 'block';
        } else {
            previewBox.style.display = 'none';
        }
    }
</script>

<script type="module" src="/js/api.js"></script>
</body>
</html>

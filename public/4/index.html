<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de CRLV - Dark Theme</title>
    <link rel="stylesheet" type="text/css" href="./styles.css">
</head>
<body>

<div class="container">
    <div class="card">
        <div class="card-header">
            <h2>Lançamento de CRLV-e</h2>
        </div>

        <form action="/salvar-crlv" method="POST" enctype="multipart/form-data" data-api-endpoint="/crlvs">
            
            <!-- Vínculo do Veículo -->
            <div class="section-title">01. Veículo Associado</div>
            
            <div class="form-group">
                <label for="caminhao_id">Selecione o Caminhão / Veículo*</label>
                <select id="caminhao_id" name="caminhao_id" required>
                    <option value="">Selecione o veículo...</option>
                    <option value="1">ABC1D23 - Cargo 816</option>
                    <option value="2">XYZ9876 - FH 540</option>
                </select>
            </div>

            <!-- Dados do Documento -->
            <div class="section-title">02. Dados do Documento (CRLV)</div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="exercicio">Ano Exercício (Licenciamento)*</label>
                    <input type="number" id="exercicio" name="exercicio" placeholder="2026" min="2020" max="2035" required>
                </div>
                <div class="form-group">
                    <label for="numero_crlv">Número do CRLV-e / Espelho*</label>
                    <input type="text" id="numero_crlv" name="numero_crlv" placeholder="01234567890" required>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="codigo_seguranca">Código de Segurança do CLA*</label>
                    <input type="text" id="codigo_seguranca" name="codigo_seguranca" placeholder="000000000" required>
                </div>
                <div class="form-group">
                    <label for="uf_veiculo">UF do Licenciamento*</label>
                    <select id="uf_veiculo" name="uf_veiculo" required>
                        <option value="">Selecione...</option>
                        <option value="SP">São Paulo (SP)</option>
                        <option value="RJ">Rio de Janeiro (RJ)</option>
                        <option value="MG">Minas Gerais (MG)</option>
                        <option value="PR">Paraná (PR)</option>
                        <option value="SC">Santa Catarina (SC)</option>
                        <option value="RS">Rio Grande do Sul (RS)</option>
                    </select>
                </div>
            </div>

            <!-- Proprietário e Categoria -->
            <div class="section-title">03. Proprietário e Categoria</div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="nome_proprietario">Nome do Proprietário / Razão Social*</label>
                    <input type="text" id="nome_proprietario" name="nome_proprietario" placeholder="Ex: Logística Brasil LTDA" required>
                </div>
                <div class="form-group">
                    <label for="documento_proprietario">CPF / CNPJ do Proprietário*</label>
                    <input type="text" id="documento_proprietario" name="documento_proprietario" placeholder="00.000.000/0001-00" required>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="categoria">Categoria*</label>
                    <select id="categoria" name="categoria" required>
                        <option value="aluguel">Aluguel (Placa Vermelha / Mercosul)</option>
                        <option value="particular">Particular</option>
                        <option value="oficial">Oficial</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="rntrc">Nº RNTRC (ANTT)</label>
                    <input type="text" id="rntrc" name="rntrc" placeholder="Ex: 123456789">
                </div>
            </div>

            <!-- Anexo Digital -->
            <div class="section-title">04. Documento Digital / PDF</div>

            <div class="form-group">
                <label for="arquivo_crlv">Anexar CRLV-e (PDF ou Imagem)*</label>
                <input type="file" id="arquivo_crlv" name="arquivo_crlv" accept=".pdf,image/*" required>
            </div>

            <button type="submit" class="btn-submit">Salvar Registro CRLV</button>
        </form>
    </div>
</div>

<script type="module" src="/js/api.js"></script>
</body>
</html>

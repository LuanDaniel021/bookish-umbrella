<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envio para Recapagem / Manutenção - Dark Theme</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: #161f30;
            --card-border: #233148;
            --input-bg: #0f172a;
            --input-border: #2a3a53;
            --primary-blue: #38bdf8;
            --primary-blue-hover: #7dd3fc;
            --text-title: #f8fafc;
            --text-main: #94a3b8;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 700px;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 24px;
            border: 1px solid var(--card-border);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
        }

        h2 { 
            font-size: 16px; 
            font-weight: 700; 
            color: var(--text-title); 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
        }

        .section-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary-blue);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 20px 0 16px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: var(--card-border);
        }

        .form-group { margin-bottom: 16px; }

        label { 
            display: block; 
            font-size: 11px; 
            font-weight: 600; 
            color: var(--text-muted); 
            margin-bottom: 6px; 
            text-transform: uppercase; 
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            font-size: 13px;
            background-color: var(--input-bg);
            color: var(--text-title);
            transition: border 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-blue);
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

        @media (max-width: 600px) {
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
        }

        .btn-submit {
            background-color: var(--primary-blue);
            color: #0f172a;
            border: none;
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background 0.2s;
            margin-top: 15px;
        }

        .btn-submit:hover { 
            background-color: var(--primary-blue-hover); 
        }

        input[type="file"]::file-selector-button {
            background: var(--card-border);
            border: none;
            color: var(--text-title);
            padding: 6px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            margin-right: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="card-header">
            <h2>Envio para Reformadora / Recapagem</h2>
        </div>

        <form action="/salvar-envio-recapagem" method="POST" enctype="multipart/form-data">
            
            <!-- 01. SELEÇÃO DO PNEU -->
            <div class="section-title" style="margin-top:0;">01. Identificação do Pneu</div>
            
            <div class="grid-2">
                <div class="form-group">
                    <label for="pneu_id">Selecione o Pneu (Nº Fogo)*</label>
                    <select id="pneu_id" name="pneu_id" required>
                        <option value="">Selecione da lista...</option>
                        <option value="1">PN-0042 - Michelin 295/80 (Vida 0 - Novo)</option>
                        <option value="2">PN-0089 - Goodyear 295/80 (Vida 1 - R1)</option>
                        <option value="3">PN-0105 - Bridgestone 295/80 (Estoque)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="tipo_servico">Serviço Solicitado*</label>
                    <select id="tipo_servico" name="tipo_servico" required>
                        <option value="recapagem">Recapagem / Recapagem + Vulcanização</option>
                        <option value="vulcanizacao">Apenas Vulcanização / Conserto</option>
                        <option value="manutencao_roda">Manutenção de Roda / Pintura</option>
                    </select>
                </div>
            </div>

            <!-- 02. FORNECEDOR E ORÇAMENTO -->
            <div class="section-title">02. Prestador de Serviço e Custos</div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="fornecedor_id">Reformadora / Prestador*</label>
                    <select id="fornecedor_id" name="fornecedor_id" required>
                        <option value="">Selecione a empresa...</option>
                        <option value="1">Bandag / Recapadora Centro-Oeste</option>
                        <option value="2">Tireshop Reforma de Pneus LTDA</option>
                        <option value="3">Pneus Renovados Brasil</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="numero_ordem_servico">Nº da O.S. / Coleta</label>
                    <input type="text" id="numero_ordem_servico" name="numero_ordem_servico" placeholder="Ex: OS-2026-881">
                </div>
            </div>

            <div class="grid-3">
                <div class="form-group">
                    <label for="data_envio">Data de Envio*</label>
                    <input type="date" id="data_envio" name="data_envio" required>
                </div>
                <div class="form-group">
                    <label for="previsao_retorno">Previsão Retorno</label>
                    <input type="date" id="previsao_retorno" name="previsao_retorno">
                </div>
                <div class="form-group">
                    <label for="custo_estimado">Valor Estimado (R$)*</label>
                    <input type="number" step="0.01" id="custo_estimado" name="custo_estimado" placeholder="550,00" required>
                </div>
            </div>

            <!-- 03. TIPO DE BANDA DE RODAGEM -->
            <div class="section-title">03. Especificações Técnicas Solicitadas</div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="desenho_banda">Modelo/Desenho da Banda</label>
                    <input type="text" id="desenho_banda" name="desenho_banda" placeholder="Ex: Bandag BDR-HT / Mi27">
                </div>
                <div class="form-group">
                    <label for="proxima_vida">Nova Vida do Pneu*</label>
                    <select id="proxima_vida" name="proxima_vida" required>
                        <option value="R1">R1 (1ª Recapagem)</option>
                        <option value="R2">R2 (2ª Recapagem)</option>
                        <option value="R3">R3 (3ª Recapagem)</option>
                    </select>
                </div>
            </div>

            <!-- 04. ANEXOS -->
            <div class="section-title">04. Documentação e Laudo</div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="comprovante_coleta">Comprovante de Coleta / O.S. (PDF/Imagem)</label>
                    <input type="file" id="comprovante_coleta" name="comprovante_coleta" accept=".pdf,image/*">
                </div>
                <div class="form-group">
                    <label for="laudo_recusa">Laudo de Descarte (caso recusado)</label>
                    <input type="file" id="laudo_recusa" name="laudo_recusa" accept=".pdf,image/*">
                </div>
            </div>

            <div class="form-group">
                <label for="observacoes">Observações Gerais</label>
                <textarea id="observacoes" name="observacoes" rows="2" placeholder="Ex: Pneu enviado com pequeno dano no talão esquerdo para avaliação..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Registrar Envio para Recapagem</button>
        </form>
    </div>
</div>

</body>
</html>
